# Project-owned Phase 0 override for the frozen upstream Compose layers.
# This file adds isolation metadata and frozen image selection without editing
# any file under third_party/opentelemetry-demo.

x-phase0-labels: &phase0-labels
  io.ecomsre.project: ecomsre-phase0
  io.ecomsre.run: ${ECOMSRE_RUN_ID:?ECOMSRE_RUN_ID is required}

x-phase0-service: &phase0-service
  platform: linux/arm64
  pull_policy: never
  labels: *phase0-labels
  ports: !override []

networks:
  default:
    name: ecomsre-phase0
    labels: *phase0-labels

volumes:
  astronomy-db-data:
    name: ecomsre-phase0-${ECOMSRE_RUN_ID:?ECOMSRE_RUN_ID is required}-astronomy-db-data
    labels: *phase0-labels
  jaeger-data:
    name: ecomsre-phase0-${ECOMSRE_RUN_ID:?ECOMSRE_RUN_ID is required}-jaeger-data
    labels: *phase0-labels
  prometheus-data:
    name: ecomsre-phase0-${ECOMSRE_RUN_ID:?ECOMSRE_RUN_ID is required}-prometheus-data
    labels: *phase0-labels

services:
  ad:
    <<: *phase0-service
    container_name: ecomsre-phase0-ad
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-ad

  cart:
    <<: *phase0-service
    container_name: ecomsre-phase0-cart
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-cart

  checkout:
    <<: *phase0-service
    container_name: ecomsre-phase0-checkout
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-checkout

  currency:
    <<: *phase0-service
    container_name: ecomsre-phase0-currency
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-currency

  email:
    <<: *phase0-service
    container_name: ecomsre-phase0-email
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-email

  frontend:
    <<: *phase0-service
    container_name: ecomsre-phase0-frontend
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-frontend

  frontend-proxy:
    <<: *phase0-service
    container_name: ecomsre-phase0-frontend-proxy
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-frontend-proxy
    ports: !override
      - target: 8080
        published: "8080"
        host_ip: "127.0.0.1"
        protocol: tcp

  image-provider:
    <<: *phase0-service
    container_name: ecomsre-phase0-image-provider
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-image-provider

  load-generator:
    <<: *phase0-service
    container_name: ecomsre-phase0-load-generator
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-load-generator

  payment:
    <<: *phase0-service
    container_name: ecomsre-phase0-payment
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-payment

  product-catalog:
    <<: *phase0-service
    container_name: ecomsre-phase0-product-catalog
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-product-catalog

  quote:
    <<: *phase0-service
    container_name: ecomsre-phase0-quote
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-quote

  recommendation:
    <<: *phase0-service
    container_name: ecomsre-phase0-recommendation
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-recommendation

  shipping:
    <<: *phase0-service
    container_name: ecomsre-phase0-shipping
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-shipping

  flagd:
    <<: *phase0-service
    container_name: ecomsre-phase0-flagd
    ports: !override
      - target: 8016
        published: "8016"
        host_ip: "127.0.0.1"
        protocol: tcp
    command:
      - start
      - --uri
      - "file:./etc/flagd/demo.flagd.json"
    volumes: !override
      - type: bind
        source: ../../artifacts/phase0/evaluator-only/${ECOMSRE_RUN_ID:?ECOMSRE_RUN_ID is required}/control
        target: /etc/flagd
        read_only: true

  flagd-ui:
    <<: *phase0-service
    container_name: ecomsre-phase0-flagd-ui
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-flagd-ui
    volumes: !override
      - type: bind
        source: ../../artifacts/phase0/evaluator-only/${ECOMSRE_RUN_ID:?ECOMSRE_RUN_ID is required}/control
        target: /app/data
        read_only: true

  telemetry-docs:
    <<: *phase0-service
    container_name: ecomsre-phase0-telemetry-docs
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-telemetry-docs

  astronomy-db:
    <<: *phase0-service
    container_name: ecomsre-phase0-astronomy-db
    volumes: !override
      - type: volume
        source: astronomy-db-data
        target: /var/lib/postgresql

  valkey-cart:
    <<: *phase0-service
    container_name: ecomsre-phase0-valkey-cart

  otel-collector:
    <<: *phase0-service
    container_name: ecomsre-phase0-otel-collector

  jaeger:
    <<: *phase0-service
    container_name: ecomsre-phase0-jaeger
    volumes: !override
      - type: volume
        source: jaeger-data
        target: /tmp
    ports: !override
      - target: 16686
        published: "16686"
        host_ip: "127.0.0.1"
        protocol: tcp

  grafana:
    <<: *phase0-service
    container_name: ecomsre-phase0-grafana

  prometheus:
    <<: *phase0-service
    container_name: ecomsre-phase0-prometheus
    volumes: !override
      - type: volume
        source: prometheus-data
        target: /prometheus
    ports: !override
      - target: 9090
        published: "9090"
        host_ip: "127.0.0.1"
        protocol: tcp

  opensearch:
    <<: *phase0-service
    container_name: ecomsre-phase0-opensearch
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-opensearch
    ports: !override
      - target: 9200
        published: "9200"
        host_ip: "127.0.0.1"
        protocol: tcp

  opamp-server:
    <<: *phase0-service
    container_name: ecomsre-phase0-opamp-server
    image: ${IMAGE_NAME}:${IMAGE_VERSION}-opamp-server
