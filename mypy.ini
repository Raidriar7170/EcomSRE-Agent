[mypy]
mypy_path = src

# Phase 5B binds these historical modules by SHA-256. Keep the frozen bytes
# intact while suppressing only the legacy error classes exposed by clean CI.
[mypy-ecomsre.environment.ownership]
disable_error_code = assignment

[mypy-ecomsre.phase0.models]
disable_error_code = union-attr, valid-type

[mypy-ecomsre.environment.manifests]
disable_error_code = union-attr

[mypy-ecomsre.evidence.models]
disable_error_code = assignment, union-attr

[mypy-ecomsre.evidence.store]
disable_error_code = assignment, arg-type

[mypy-ecomsre.environment.preflight]
disable_error_code = assignment, arg-type

[mypy-ecomsre.environment.command_runner]
disable_error_code = arg-type
