name: Agent mainline

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-mainline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-replay:
    name: Offline replay and verification
    runs-on: macos-14
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Fetch pinned upstream tag metadata
        run: git -C third_party/opentelemetry-demo fetch origin tag 3.0.0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync frozen dependencies
        run: uv sync --frozen --python 3.11 --group ci

      - name: Install frozen RCA100 dependencies
        run: >-
          uv pip install --python .venv --requirement
          config/rca100-metrics-arbitration-v1/python-dependency-lock.txt

      - name: Phase 1 tests
        run: make phase1-test

      - name: Phase 2 tests
        run: make phase2-test

      - name: Phase 2 comparison
        run: make phase2-compare

      - name: Verify Phase 2 comparison
        run: make phase2-verify

      - name: Phase 3 tests
        run: make phase3-test

      - name: Phase 3 replay
        run: make phase3-replay

      - name: Verify Phase 3 replay
        run: make phase3-verify

      - name: Phase 4 tests
        run: make phase4-test

      - name: Phase 4 domain comparison
        run: make phase4-compare

      - name: Verify Phase 4 domain comparison
        run: make phase4-verify

      - name: Phase 4 domain demo
        run: make phase4-demo

      - name: Phase 5A tests
        run: make phase5a-test

      - name: Phase 5A capability-parity comparison
        run: make phase5a-compare

      - name: Verify Phase 5A capability-parity comparison
        run: make phase5a-verify

      - name: Phase 5A missing-source demo
        run: make phase5a-demo

      - name: Phase 5B protocol tests
        run: make phase5b-test

      - name: Phase 5B historical bindings
        run: >-
          env PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/src"
          uv run --frozen --no-sync python -m
          scripts.ci.verify_phase5b_historical_bindings

      - name: DTA v2 historical bindings for v2.1
        run: make dta-v21-historical-verify

      - name: DTA v2.1 focused tests
        run: make dta-v21-test

      - name: DTA v2.1 deterministic replay verification
        run: make dta-v21-replay-verify

      - name: DTA v2.1 public development evaluation verification
        run: make dta-v21-development-verify

      - name: DTA v2.1 public held-out evaluation verification
        run: make dta-v21-held-out-report-verify

      - name: DTA v2.2 PR-A protocol and historical verification
        run: >-
          env PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/src"
          uv run --frozen --no-sync python -m scripts.ci.verify_dta_v22_pr_a

      - name: DTA v2.2 focused tests
        run: >-
          env PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/src"
          uv run --frozen --no-sync pytest tests/dta_v22 -q

      - name: Phase 5B execution historical bindings for successors
        run: >-
          env PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/src"
          uv run --frozen --no-sync python -m
          scripts.ci.verify_phase5b_execution_historical_bindings

      - name: Verify Phase 5B protocol
        run: make phase5b-protocol-verify

      - name: Verify Phase 5B execution schedule
        run: make phase5b-schedule

      - name: Phase 5B mock-only dry run
        run: make phase5b-dry-run

      - name: Verify Phase 5B mock-only dry run
        run: make phase5b-dry-run-verify

      - name: Agent mainline demo
        run: make agent-demo

      - name: Full repository tests
        run: uv run --frozen --no-sync pytest -q

      - name: Ruff
        run: uv run --frozen --no-sync ruff check .

      - name: mypy (Agent mainline scope)
        run: >-
          uv run --frozen --no-sync mypy
          src/ecomsre/backends
          src/ecomsre/model
          src/ecomsre/phase1
          src/ecomsre/phase2
          src/ecomsre/phase3
          src/ecomsre/phase4
          src/ecomsre/phase5a
          src/ecomsre/phase5b
          src/ecomsre/dta_v2
          src/ecomsre/tools
          src/ecomsre/demo
          src/ecomsre_live_sandbox
          src/ecomsre_rcaeval
          eval/phase1/run.py
          eval/phase2/compare.py
          eval/phase4/runner.py
          eval/phase5a/runner.py
          eval/phase5b/runner.py
          scripts/rcaeval
          scripts/ci
          scripts/live_sandbox
          tests/dta_v21
          tests/phase5b
