name: RCAEval RE2 v2 development

on:
  pull_request:
    paths:
      - "src/ecomsre_rcaeval_v2/**"
      - "src/ecomsre_rcaeval_adaptive/**"
      - "src/ecomsre_rca100/**"
      - "src/ecomsre_rca_unified/**"
      - "scripts/rcaeval_v2/**"
      - "scripts/rcaeval_adaptive/**"
      - "scripts/rca100/**"
      - "scripts/rca_compact/**"
      - "scripts/analysis/**"
      - "tests/benchmarks/rcaeval_v2/**"
      - "tests/benchmarks/rcaeval_adaptive/**"
      - "tests/benchmarks/rca100/**"
      - "tests/analysis/**"
      - "config/rcaeval-re2-v2-dev/**"
      - "config/rcaeval-re2-v2-dev1/**"
      - "config/rcaeval-re2-v2-dev2/**"
      - "config/rcaeval-re2-v2-dev3/**"
      - "config/rcaeval-adaptive-v1/**"
      - "config/rca100-metrics-arbitration-v1/**"
      - "config/rca-crossbenchmark-architecture-convergence-v1/**"
      - "config/rca-compact-evidence-retrieval-v1/**"
      - "docs/analysis/**"
      - "docs/design/rca-crossbenchmark-architecture-decision.md"
      - "docs/design/unified-hierarchical-rca-v1-spec.md"
      - "docs/design/compact-evidence-retrieval-*.md"
      - "docs/results/unified-hierarchical-rca-v1-*"
      - "docs/results/compact-evidence-retrieval-*"
      - "docs/**/rcaeval-re2-v2-dev*"
      - "docs/design/rcaeval-agent-redesign-handoff.md"
      - "docs/design/rcaeval-single-first-adaptive-v1.md"
      - "docs/results/rcaeval-single-first-adaptive-v1*"
      - ".github/workflows/rcaeval-v2-dev.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group ci
      - run: uv pip install --python .venv --requirement config/rca100-metrics-arbitration-v1/python-dependency-lock.txt
      - run: uv run --frozen --no-sync pytest -q tests/analysis tests/benchmarks/rcaeval_v2 tests/benchmarks/rcaeval_adaptive tests/benchmarks/rca100
      - run: uv run --frozen --no-sync ruff check src/ecomsre_rcaeval_v2 src/ecomsre_rcaeval_adaptive src/ecomsre_rca100 src/ecomsre_rca_unified scripts/analysis scripts/rcaeval_v2 scripts/rcaeval_adaptive scripts/rca100 scripts/rca_compact tests/analysis tests/benchmarks/rcaeval_v2 tests/benchmarks/rcaeval_adaptive tests/benchmarks/rca100
      - run: uv run --frozen --no-sync mypy src/ecomsre_rcaeval_v2 src/ecomsre_rcaeval_adaptive src/ecomsre_rca100 src/ecomsre_rca_unified scripts/analysis scripts/rcaeval_v2 scripts/rcaeval_adaptive scripts/rca100 scripts/rca_compact
      - name: Scan RCA100 pre-execution runtime for label markers
        run: >-
          uv run --frozen --no-sync python -c
          "from pathlib import Path; from ecomsre_rca100.public_projection import scan_preexecution_runtime, verify_runtime_evaluator_import_separation; root=Path.cwd(); assert not scan_preexecution_runtime(root); verify_runtime_evaluator_import_separation(root)"
      - name: Scan v2 development public outputs for leakage
        run: >-
          uv run --frozen --no-sync python -m scripts.rcaeval_v2.scan_public_outputs
          --allow-missing
          docs/results/rcaeval-re2-v2-dev1-design-aggregate.json
          docs/results/rcaeval-re2-v2-dev1-design-summary.md
          docs/review-evidence/rcaeval-re2-v2-dev1/current-disposition.json
          docs/review-evidence/rcaeval-re2-v2-dev1/provider-smoke-gate.json
          docs/review-evidence/rcaeval-re2-v2-dev1/design-gate.json
          docs/review-evidence/rcaeval-re2-v2-dev1/human-brief.md
          docs/results/rcaeval-re2-v2-dev2-design-aggregate.json
          docs/results/rcaeval-re2-v2-dev2-design-summary.md
          docs/review-evidence/rcaeval-re2-v2-dev2/current-disposition.json
          docs/review-evidence/rcaeval-re2-v2-dev2/schedule-admission-gate.json
          docs/review-evidence/rcaeval-re2-v2-dev2/provider-smoke-gate.json
          docs/review-evidence/rcaeval-re2-v2-dev2/design-gate.json
          docs/review-evidence/rcaeval-re2-v2-dev2/human-brief.md
          docs/external-benchmarks/rcaeval-re2-v2-dev3-protocol.md
          docs/external-benchmarks/rcaeval-re2-v2-dev3-data-card.md
          docs/results/rcaeval-re2-v2-dev3-smoke-aggregate.json
          docs/results/rcaeval-re2-v2-dev3-design-aggregate.json
          docs/results/rcaeval-re2-v2-dev3-summary.md
          docs/results/rcaeval-re2-v2-dev3-final-infrastructure-limit.md
          docs/review-evidence/rcaeval-re2-v2-dev3/current-disposition.json
          docs/review-evidence/rcaeval-re2-v2-dev3/provider-failure-audit.json
          docs/review-evidence/rcaeval-re2-v2-dev3/schedule-admission-gate.json
          docs/review-evidence/rcaeval-re2-v2-dev3/provider-smoke-gate.json
          docs/review-evidence/rcaeval-re2-v2-dev3/design-gate.json
          docs/review-evidence/rcaeval-re2-v2-dev3/human-brief.md
          docs/design/rcaeval-agent-redesign-handoff.md
          docs/design/rcaeval-single-first-adaptive-v1.md
          docs/results/rcaeval-single-first-adaptive-v1.json
          docs/results/rcaeval-single-first-adaptive-v1.md
          docs/results/rcaeval-single-first-adaptive-v1-human-brief.md
      - name: Scan compact retrieval public outputs for leakage
        run: uv run --frozen --no-sync python -m scripts.rca_compact.cli verify-public
