name: RCAEval RE2 v2 development

on:
  pull_request:
    paths:
      - "src/ecomsre_rcaeval_v2/**"
      - "scripts/rcaeval_v2/**"
      - "tests/benchmarks/rcaeval_v2/**"
      - "config/rcaeval-re2-v2-dev/**"
      - "config/rcaeval-re2-v2-dev1/**"
      - "config/rcaeval-re2-v2-dev2/**"
      - "docs/**/rcaeval-re2-v2-dev*"
      - ".github/workflows/rcaeval-v2-dev.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group ci
      - run: uv run --frozen --no-sync pytest -q tests/benchmarks/rcaeval_v2
      - run: uv run --frozen --no-sync ruff check src/ecomsre_rcaeval_v2 scripts/rcaeval_v2 tests/benchmarks/rcaeval_v2
      - run: uv run --frozen --no-sync mypy src/ecomsre_rcaeval_v2 scripts/rcaeval_v2
      - name: Scan v2 development public outputs for leakage
        run: >-
          uv run --frozen --no-sync python -m scripts.rcaeval_v2.scan_public_outputs
          --allow-missing
          docs/results/rcaeval-re2-v2-dev1-design-aggregate.json
          docs/results/rcaeval-re2-v2-dev1-design-summary.md
          docs/review-evidence/rcaeval-re2-v2-dev1/current-disposition.json
          docs/review-evidence/rcaeval-re2-v2-dev1/provider-smoke-gate.json
          docs/review-evidence/rcaeval-re2-v2-dev1/design-gate.json
          docs/review-evidence/rcaeval-re2-v2-dev1/human-brief.md
          docs/results/rcaeval-re2-v2-dev2-design-aggregate.json
          docs/results/rcaeval-re2-v2-dev2-design-summary.md
          docs/review-evidence/rcaeval-re2-v2-dev2/current-disposition.json
          docs/review-evidence/rcaeval-re2-v2-dev2/schedule-admission-gate.json
          docs/review-evidence/rcaeval-re2-v2-dev2/provider-smoke-gate.json
          docs/review-evidence/rcaeval-re2-v2-dev2/design-gate.json
          docs/review-evidence/rcaeval-re2-v2-dev2/human-brief.md
