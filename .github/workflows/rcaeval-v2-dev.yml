name: RCAEval RE2 v2 development

on:
  pull_request:
    paths:
      - "src/ecomsre_rcaeval_v2/**"
      - "scripts/rcaeval_v2/**"
      - "tests/benchmarks/rcaeval_v2/**"
      - "config/rcaeval-re2-v2-dev/**"
      - "docs/**/rcaeval-re2-v2-dev*"
      - ".github/workflows/rcaeval-v2-dev.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen --no-sync pytest -q tests/benchmarks/rcaeval_v2
      - run: uv run --frozen --no-sync ruff check src/ecomsre_rcaeval_v2 scripts/rcaeval_v2 tests/benchmarks/rcaeval_v2
      - run: uv run --frozen --no-sync mypy src/ecomsre_rcaeval_v2 scripts/rcaeval_v2
