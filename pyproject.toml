[project]
name = "ecomsre-agent"
version = "0.1.0"
description = "Deterministic Phase 0 control and evidence contracts for EcomSRE-Agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "tiktoken==0.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]
ci = [
    "mypy==1.20.2",
    "ruff==0.16.1",
]

[tool.ruff]
exclude = ["third_party/opentelemetry-demo"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = false
