<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="diagram-title"><title id="diagram-title">Four layers: diagnosis branches to knowledge or separately authorized remediation</title><rect width="1000" height="650" fill="#f6f8fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355f85"/></marker></defs><rect x="30" y="20" width="940" height="85" rx="6" fill="white" stroke="#b5c7d9"/><text x="48" y="52" font-size="21" font-family="sans-serif" fill="#173d60">A · Environment and Evidence</text><text x="48" y="80" font-size="17" font-family="sans-serif" fill="#344559">Identity → Active Baseline → Typed Observations → CAS</text><rect x="30" y="135" width="940" height="85" rx="6" fill="white" stroke="#b5c7d9"/><text x="48" y="167" font-size="21" font-family="sans-serif" fill="#173d60">B · Deterministic Diagnosis</text><text x="48" y="195" font-size="17" font-family="sans-serif" fill="#344559">Core → Extension → No-Incident → Open-World / evidence gap</text><path d="M500,105 V135" fill="none" stroke="#355f85" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="280" width="440" height="135" rx="6" fill="white" stroke="#b5c7d9"/><text x="48" y="312" font-size="21" font-family="sans-serif" fill="#173d60">C · Human-Gated Knowledge</text><text x="48" y="340" font-size="17" font-family="sans-serif" fill="#344559">Fault Family → Rule Mining</text><text x="48" y="365" font-size="17" font-family="sans-serif" fill="#344559">Shadow → Human Promotion</text><text x="48" y="390" font-size="17" font-family="sans-serif" fill="#344559">ACTIVE Extension → back to Diagnosis</text><rect x="530" y="280" width="440" height="160" rx="6" fill="white" stroke="#b5c7d9"/><text x="548" y="312" font-size="21" font-family="sans-serif" fill="#173d60">D · Bounded Remediation</text><text x="548" y="340" font-size="17" font-family="sans-serif" fill="#344559">Candidate → Approval → fresh State</text><text x="548" y="365" font-size="17" font-family="sans-serif" fill="#344559">Authorization → WriteIntent</text><text x="548" y="390" font-size="17" font-family="sans-serif" fill="#344559">Isolated Executor → StepReceipt</text><text x="548" y="415" font-size="17" font-family="sans-serif" fill="#344559">Two Recovery Windows → Evaluation</text><path d="M250,220 V280" fill="none" stroke="#355f85" stroke-width="2" marker-end="url(#arrow)"/><path d="M750,220 V280" fill="none" stroke="#355f85" stroke-width="2" marker-end="url(#arrow)"/><path d="M30,360 H12 V185 H30" fill="none" stroke="#355f85" stroke-width="2" marker-end="url(#arrow)"/><text x="70" y="255" font-size="17" font-family="sans-serif" fill="#355f85">Unexplained anomaly</text><text x="590" y="255" font-size="17" font-family="sans-serif" fill="#355f85">Eligible Core diagnosis only</text><text x="40" y="510" font-size="18" font-family="sans-serif" fill="#173d60">Diagnosis action_authority = NONE · Approval ≠ execution authority</text><text x="40" y="548" font-size="18" font-family="sans-serif" fill="#173d60">LLM does not select target / action / command</text><text x="40" y="586" font-size="18" font-family="sans-serif" fill="#173d60">Executor has no Docker socket · One local Payment Runbook</text><text x="40" y="624" font-size="18" font-family="sans-serif" fill="#173d60">Knowledge promotion never grants remediation authority</text></svg>
