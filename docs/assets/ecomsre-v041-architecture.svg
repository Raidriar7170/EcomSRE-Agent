<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="diagram-title"><title id="diagram-title">EcomSRE-Agent four-layer architecture</title><rect width="1000" height="640" fill="#f6f8fc"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#355f85"/></marker></defs><rect x="30" y="20" width="940" height="80" rx="6" fill="white" stroke="#b5c7d9"/><text x="50" y="49" font-size="22" font-family="sans-serif" fill="#173d60">A · Environment and Evidence</text><text x="50" y="78" font-size="18" font-family="sans-serif" fill="#344559">Identity → Active Baseline → Typed Observations → CAS</text><path d="M500,100 v20" stroke="#355f85" marker-end="url(#arrow)"/><rect x="30" y="120" width="940" height="80" rx="6" fill="white" stroke="#b5c7d9"/><text x="50" y="149" font-size="22" font-family="sans-serif" fill="#173d60">B · Deterministic Diagnosis</text><text x="50" y="178" font-size="18" font-family="sans-serif" fill="#344559">Core → Extension → No-Incident → Open-World / evidence gap</text><path d="M500,200 v20" stroke="#355f85" marker-end="url(#arrow)"/><rect x="30" y="220" width="940" height="80" rx="6" fill="white" stroke="#b5c7d9"/><text x="50" y="249" font-size="22" font-family="sans-serif" fill="#173d60">C · Human-Gated Knowledge Evolution</text><text x="50" y="278" font-size="18" font-family="sans-serif" fill="#344559">Fault Family → Rule Mining → Shadow → Human Promotion</text><path d="M500,300 v20" stroke="#355f85" marker-end="url(#arrow)"/><rect x="30" y="320" width="940" height="80" rx="6" fill="white" stroke="#b5c7d9"/><text x="50" y="349" font-size="22" font-family="sans-serif" fill="#173d60">D · Bounded Remediation</text><text x="50" y="378" font-size="18" font-family="sans-serif" fill="#344559">Candidate → Approval → fresh State → Authorization</text><path d="M500,400 v20" stroke="#355f85" marker-end="url(#arrow)"/><rect x="30" y="420" width="940" height="80" rx="6" fill="white" stroke="#b5c7d9"/><text x="50" y="449" font-size="22" font-family="sans-serif" fill="#173d60">One bounded action, two recovery windows</text><text x="50" y="478" font-size="18" font-family="sans-serif" fill="#344559">WriteIntent → isolated Executor → StepReceipt → RecoveryEvaluation</text><text x="40" y="545" font-size="18" font-family="sans-serif" fill="#173d60">Diagnosis action_authority = NONE · Approval ≠ execution authority</text><text x="40" y="578" font-size="18" font-family="sans-serif" fill="#173d60">LLM does not select target / action / command</text><text x="40" y="611" font-size="18" font-family="sans-serif" fill="#173d60">Executor has no Docker socket · Current scope: one local Payment Runbook</text></svg>
